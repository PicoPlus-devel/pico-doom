name: Build pico-mac

on:
  push:
  pull_request:
  release:
    types: [published]
  check_suite:
    types: [rerequested]


jobs:
  bins:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install ARM GCC
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '13.2.Rel1'

    - name: get submodules
      run: git submodule update --init

    - name: get pico-sdk submodules
      run: (cd 3rdparty/pico-sdk && git submodule update --init && cd lib/tinyusb && ./tools/get_deps.py rp2040)

    - name: build targets
      run: |
          ./fruitjam-build.sh
          mkdir uf2s
          cp build*/src/*.uf2 uf2s/
          mkdir elfs
          cp build*/src/*.elf elfs/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: uf2 files
        path: uf2s/*

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: elf files
        path: elfs/*

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: uf2s/*
        fail_on_unmatched_files: true
        body: "Select a doom_tiny uf2 from the list below, plus the doom1-whx uf2."

